# XcodeGen manifest. Generate with: xcodegen generate
name: Engram
options:
  bundleIdPrefix: com.engram # TODO(owner): set your bundle id prefix
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  EngramCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Engram:
    type: application
    platform: macOS
    sources:
      - path: Sources/Presentation
        excludes:
          - Resources
      # Folder reference: KaTeX ships verbatim so its CSS finds fonts/ at runtime.
      - path: Sources/Presentation/Resources/KaTeX
        type: folder
    dependencies:
      - package: EngramCore
        products:
          - Domain
          - Application
          - Infrastructure
    info:
      path: Sources/Presentation/Info.plist
      properties:
        CFBundleDisplayName: Engram # TODO(owner): rename here if the app name changes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engram.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # TODO(owner): enable App Sandbox + entitlements before release.
