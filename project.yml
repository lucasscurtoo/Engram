# XcodeGen manifest. Generate with: xcodegen generate
name: Recall
options:
  bundleIdPrefix: com.recall # TODO(owner): set your bundle id prefix
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  RecallCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Recall:
    type: application
    platform: macOS
    sources:
      - Sources/Presentation
    dependencies:
      - package: RecallCore
        products:
          - Domain
          - Application
          - Infrastructure
    info:
      path: Sources/Presentation/Info.plist
      properties:
        CFBundleDisplayName: Recall # TODO(owner): rename here if the app name changes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recall.app
        # TODO(owner): enable App Sandbox + entitlements before release (M7).
